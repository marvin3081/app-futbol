<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-2xl mx-auto space-y-5">
    
    <header class="text-center py-3 border-b border-slate-800">
      <h1 class="text-2xl font-black text-emerald-400 tracking-wide">⚡ TRACKER & PRONÓSTICOS</h1>
      <p class="text-slate-400 text-xs mt-1">Partidos del día, horarios locales y análisis rápido</p>
    </header>

    <!-- Barra de búsqueda -->
    <div class="flex gap-2">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Ej: Arsenal, Real Madrid, Chelsea..." 
        class="bg-slate-900 text-white px-4 py-3 rounded-xl w-full border border-slate-800 focus:outline-none focus:border-emerald-500 transition-all text-sm"
        onkeydown="if(event.key === 'Enter') ejecutarBusqueda()"
      />
      <button 
        id="btnBuscar"
        onclick="ejecutarBusqueda()" 
        class="bg-emerald-500 hover:bg-emerald-400 px-6 rounded-xl font-bold text-slate-950 transition-all text-sm shrink-0">
        Buscar
      </button>
    </div>

    <!-- Atajos Rápidos -->
    <div class="flex flex-wrap gap-2 text-xs">
      <button onclick="cargarPartidosDeHoy()" class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold px-3 py-1.5 rounded-lg hover:bg-emerald-500/30 transition-all">
        📅 Partidos de Hoy
      </button>
      <button onclick="buscarAtajo('Panama')" class="bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:border-emerald-500/50 text-slate-300">🇵🇦 Panamá</button>
      <button onclick="buscarAtajo('Arsenal')" class="bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:border-emerald-500/50 text-slate-300">🔴 Arsenal</button>
      <button onclick="buscarAtajo('Real Madrid')" class="bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:border-emerald-500/50 text-slate-300">⚪ Real Madrid</button>
      <button onclick="buscarAtajo('Chelsea')" class="bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:border-emerald-500/50 text-slate-300">🔵 Chelsea</button>
    </div>

    <!-- Estado -->
    <div id="status" class="text-xs text-amber-400 text-center font-mono">Toca "Partidos de Hoy" o realiza una búsqueda</div>

    <!-- Contenedor de Resultados -->
    <div id="contenedorResultados" class="space-y-3"></div>

    <!-- Modal forma -->
    <div id="modalStats" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-md w-full space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 id="modalTitulo" class="font-bold text-emerald-400 text-sm truncate">Forma Reciente</h3>
          <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-lg leading-none">&times;</button>
        </div>
        <div id="modalContenido" class="space-y-2 text-xs text-slate-300"></div>
      </div>
    </div>

  </div>

  <script>
    function buscarAtajo(termino) {
      document.getElementById('searchInput').value = termino;
      ejecutarBusqueda();
    }

    async function cargarPartidosDeHoy() {
      const contenedor = document.getElementById('contenedorResultados');
      const status = document.getElementById('status');
      
      status.innerText = "Consultando cartelera de hoy...";
      contenedor.innerHTML = '<div class="py-12 text-center text-slate-500">Cargando encuentros de la jornada...</div>';

      try {
        const res = await fetch(`/api/futbol?type=today_matches`);
        const json = await res.json();

        if (!res.ok || json.error) {
          const detalle = json.error || (json.detalles ? JSON.stringify(json.detalles) : `HTTP ${res.status}`);
          throw new Error(detalle);
        }

        const partidos = Array.isArray(json.data) ? json.data : [];

        if (partidos.length === 0) {
          status.innerText = "Jornada vacía";
          contenedor.innerHTML = '<div class="py-8 text-center text-slate-500 text-sm">No hay partidos registrados para hoy en este momento.</div>';
          return;
        }

        status.innerText = `Origen: ${json.origen === 'cache' ? 'Caché' : 'En vivo'} · ${partidos.length} encuentros hoy`;
        renderizarPartidosHoy(partidos);
      } catch (err) {
        status.innerText = "Error detectado";
        contenedor.innerHTML = `
          <div class="p-4 bg-red-950/40 border border-red-800 rounded-xl text-left text-red-300 text-xs font-mono space-y-1">
            <p class="font-bold text-red-200">Fallo en la consulta:</p>
            <p class="break-all">${err.message}</p>
          </div>`;
      }
    }

    function renderizarPartidosHoy(lista) {
      const contenedor = document.getElementById('contenedorResultados');
      contenedor.innerHTML = lista.map(p => {
        const local = p.home_team?.name || p.home_team || p.team_home || 'Local';
        const visita = p.away_team?.name || p.away_team || p.team_away || 'Visita';
        const torneo = p.competition?.name || p.league?.name || p.competition_name || 'Competición';
        const estado = p.status || p.match_status || 'Programado';

        let horaTexto = '--:--';
        const fechaCruda = p.kickoff_utc || p.date || p.match_time || p.start_time;
        if (fechaCruda) {
          const fechaObj = new Date(fechaCruda);
          if (!isNaN(fechaObj.getTime())) {
            horaTexto = fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
        }

        const hScore = p.home_score ?? p.score_home ?? p.score?.home;
        const aScore = p.away_score ?? p.score_away ?? p.score?.away;

        const marcador = (hScore !== undefined && hScore !== null && aScore !== undefined && aScore !== null)
          ? `${hScore} - ${aScore}`
          : horaTexto;

        return `
          <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 space-y-2 hover:border-slate-700 transition-all">
            <div class="flex justify-between items-center text-[11px] text-slate-500 border-b border-slate-800/60 pb-1.5">
              <span class="truncate font-medium text-emerald-400/80">${torneo}</span>
              <span class="px-2 py-0.5 rounded bg-slate-950 text-slate-400 font-mono">${estado}</span>
            </div>
            <div class="flex justify-between items-center text-sm pt-0.5">
              <span class="font-semibold text-slate-200 truncate flex-1">${local}</span>
              <span class="font-bold text-white px-3 font-mono bg-slate-950 py-1 rounded-lg border border-slate-800 text-xs shrink-0">${marcador}</span>
              <span class="font-semibold text-slate-200 truncate flex-1 text-right">${visita}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function ejecutarBusqueda() {
      const query = document.getElementById('searchInput').value.trim();
      const contenedor = document.getElementById('contenedorResultados');
      const status = document.getElementById('status');
      const btn = document.getElementById('btnBuscar');

      if (!query) return;

      btn.disabled = true;
      status.innerText = "Buscando...";
      contenedor.innerHTML = '<div class="py-12 text-center text-slate-500">Cargando resultados...</div>';

      try {
        const res = await fetch(`/api/futbol?type=search&query=${encodeURIComponent(query)}`);
        const json = await res.json();
        
        if (!res.ok || json.error) {
          const detalle = json.error || (json.detalles ? JSON.stringify(json.detalles) : `HTTP ${res.status}`);
          throw new Error(detalle);
        }

        const items = Array.isArray(json.data) ? json.data : [];
        if (items.length === 0) {
          status.innerText = "Sin resultados";
          contenedor.innerHTML = '<div class="py-8 text-center text-slate-500 text-sm">No se encontraron datos para este término.</div>';
          return;
        }

        status.innerText = `${items.length} coincidencia(s) (${json.origen === 'cache' ? 'Caché' : 'En vivo'})`;
        renderizarLista(items);
      } catch (err) {
        status.innerText = "Error en la búsqueda";
        contenedor.innerHTML = `
          <div class="p-4 bg-red-950/40 border border-red-800 rounded-xl text-left text-red-300 text-xs font-mono space-y-1">
            <p class="font-bold text-red-200">Fallo en la búsqueda:</p>
            <p class="break-all">${err.message}</p>
          </div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderizarLista(lista) {
      const contenedor = document.getElementById('contenedorResultados');
      contenedor.innerHTML = lista.map(item => {
        const id = item.id || item.team_id || '';
        const nombre = item.name || item.team_name || 'Sin nombre';
        const pais = item.country?.name || item.country || item.country_name || 'Internacional';
        const logo = item.logo || item.logo_url || 'https://via.placeholder.com/64?text=⚽';

        return `
          <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-3 flex items-center justify-between hover:border-slate-700">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${logo}" class="w-9 h-9 object-contain bg-slate-950 rounded p-1" onerror="this.src='https://via.placeholder.com/64?text=⚽'"/>
              <div class="truncate">
                <h4 class="font-bold text-sm text-white truncate">${nombre}</h4>
                <p class="text-xs text-emerald-400 truncate">${pais}</p>
              </div>
            </div>
            ${id ? `
              <button onclick="verPartidos('${id}', '${nombre.replace(/'/g, "\\'")}')" class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg hover:bg-emerald-500/20">
                📊 Forma
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function verPartidos(id, nombre) {
      const modal = document.getElementById('modalStats');
      const titulo = document.getElementById('modalTitulo');
      const contenido = document.getElementById('modalContenido');

      titulo.innerText = `Últimos partidos: ${nombre}`;
      contenido.innerHTML = '<div class="py-4 text-center text-slate-500">Cargando...</div>';
      modal.classList.remove('hidden');

      try {
        const res = await fetch(`/api/futbol?type=matches&id=${id}`);
        const json = await res.json();
        if (!res.ok || json.error) throw new Error(json.error || `HTTP ${res.status}`);

        const matches = Array.isArray(json.data) ? json.data : [];
        if (matches.length === 0) {
          contenido.innerHTML = '<div class="py-2 text-center text-slate-500">Sin datos recientes.</div>';
          return;
        }

        contenido.innerHTML = matches.map(m => {
          const l = m.home_team?.name || m.home_team || 'Local';
          const v = m.away_team?.name || m.away_team || 'Visita';
          const gL = m.home_score !== undefined ? m.home_score : '-';
          const gV = m.away_score !== undefined ? m.away_score : '-';
          return `
            <div class="flex justify-between items-center p-2 rounded bg-slate-950 border border-slate-800">
              <span class="truncate flex-1">${l}</span>
              <span class="font-bold text-white px-2 font-mono">${gL} - ${gV}</span>
              <span class="truncate flex-1 text-right">${v}</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        contenido.innerHTML = `<div class="text-red-400 text-center py-2 text-xs">${err.message}</div>`;
      }
    }

    function cerrarModal() {
      document.getElementById('modalStats').classList.add('hidden');
    }
  </script>
</body>
</html>
