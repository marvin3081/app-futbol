<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbol Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="text-center py-4 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-emerald-400">⚽ App de Fútbol</h1>
      <p class="text-slate-400 text-sm">Tablas de posiciones</p>
    </header>

    <!-- Selector de Liga -->
    <div class="flex gap-2">
      <label for="leagueSelect" class="sr-only">Liga</label>
      <select id="leagueSelect" class="bg-slate-800 text-white p-3 rounded-lg w-full border border-slate-700">
        <option value="261">LPF Panamá</option>
        <option value="140">LaLiga (España)</option>
        <option value="39">Premier League (Inglaterra)</option>
        <option value="135">Serie A (Italia)</option>
        <option value="78">Bundesliga (Alemania)</option>
        <option value="61">Ligue 1 (Francia)</option>
        <option value="262">Liga MX (México)</option>
        <option value="253">MLS (EE. UU.)</option>
        <option value="71">Brasileirão (Brasil)</option>
        <option value="128">Liga Profesional (Argentina)</option>
        <option value="2">UEFA Champions League</option>
        <option value="3">UEFA Europa League</option>
        <option value="13">Copa Libertadores</option>
      </select>
      <button id="btnCargar" class="bg-emerald-500 hover:bg-emerald-600 px-5 rounded-lg font-bold text-slate-950">
        Cargar
      </button>
    </div>

    <!-- Indicador de Estado -->
    <div id="status" class="text-xs text-amber-400 text-center"></div>

    <!-- Contenedor Tabla -->
    <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50 shadow-xl overflow-x-auto">
      <h2 class="text-lg font-semibold mb-3 text-slate-200">Tabla de Posiciones</h2>
      <table class="w-full text-left text-sm">
        <thead class="text-slate-400 border-b border-slate-700">
          <tr>
            <th class="pb-2">#</th>
            <th class="pb-2">Equipo</th>
            <th class="pb-2 text-center">PJ</th>
            <th class="pb-2 text-center">Pts</th>
          </tr>
        </thead>
        <tbody id="tablaBody" class="divide-y divide-slate-800">
          <tr><td colspan="4" class="py-4 text-center text-slate-500">Selecciona una liga...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const VERCEL_URL = "";

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function cargarTabla() {
      const leagueId = document.getElementById('leagueSelect').value;
      const tbody = document.getElementById('tablaBody');
      const status = document.getElementById('status');
      tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400">Cargando datos...</td></tr>';

      try {
        const res = await fetch(`${VERCEL_URL}/api/futbol?type=standings&league=${leagueId}`);
        const json = await res.json();

        if (json.error) throw new Error(json.error);

        const standings = json.data?.[0]?.league?.standings?.[0];
        if (!standings?.length) {
          const e = json.errors && Object.values(json.errors)[0];
          throw new Error(e || "No hay datos de tabla para esta liga.");
        }

        status.innerText = `Temporada ${json.season} · Llamadas restantes hoy: ${json.remaining ?? '?'}`;
        renderizarTabla(standings);
      } catch (err) {
        status.innerText = "";
        tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-400">${esc(err.message)}</td></tr>`;
      }
    }

    function renderizarTabla(filas) {
      const tbody = document.getElementById('tablaBody');
      tbody.innerHTML = filas.map(item => `
        <tr class="hover:bg-slate-800/80">
          <td class="py-3 font-bold ${item.rank <= 3 ? 'text-emerald-400' : 'text-slate-400'}">${esc(item.rank)}</td>
          <td class="py-3 flex items-center gap-2">
            <img src="${esc(item.team.logo)}" class="w-5 h-5 object-contain" alt="" onerror="this.style.visibility='hidden'">
            <span>${esc(item.team.name)}</span>
          </td>
          <td class="py-3 text-center text-slate-400">${esc(item.all.played)}</td>
          <td class="py-3 text-center font-bold text-slate-100">${esc(item.points)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('leagueSelect').addEventListener('change', cargarTabla);
    document.getElementById('btnCargar').addEventListener('click', cargarTabla);
    cargarTabla();
  </script>
</body>
</html>
